<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scheduled Insights — Wireframes v2</title>
<style>
  :root{
    --bg:#eceef0;
    --surface:#ffffff;
    --surface-2:#f6f7f8;
    --line:#e2e4e7;
    --line-2:#cbd0d5;
    --line-dash:#c2c8ce;
    --text:#1c1e21;
    --text-2:#5b6169;
    --text-3:#8b9199;
    --fill:#eef0f2;
    --fill-2:#e3e6e9;
    --ink:#2f3a45;
    --sel:#dfe6ee;
    --sel-line:#9fb2c6;
    --warn-fill:#f0ece4;
    --warn-line:#d8ccb6;
    --r:4px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    /* type scale mirrors @conveyorhq/design-tokens */
    --h1:26px; --h2:20px; --h3:16px; --h4:14px; --body:14px; --sm:12px; --xs:11px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    font-family:var(--font);
    font-size:var(--body);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- workbench ---------- */
  .workbench{padding:32px 32px 200px;max-width:1520px;margin:0 auto}
  .wb-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  .wb-head h1{font-size:var(--h2);margin:0;letter-spacing:-.01em}
  .wb-head .tag{font-size:var(--xs);text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
  .wb-sub{font-size:var(--sm);color:var(--text-2);margin:0 0 20px}

  .artboard-label{max-width:1440px;margin-left:auto;margin-right:auto;display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:var(--xs);
    text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
  .artboard-label b{color:var(--text-2);font-weight:600}

  .artboard{
    width:100%;max-width:1440px;margin:0 auto;
    background:var(--surface);border:1px solid var(--line-2);border-radius:6px;
    overflow:hidden;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.04);
    min-height:720px;display:flex;
  }

  /* ---------- notes ---------- */
  .notes{
    max-width:1440px;margin:12px auto 0;border:1px dashed var(--line-dash);border-radius:6px;background:var(--surface-2);
    padding:14px 16px;font-size:var(--sm);color:var(--text-2);line-height:1.55;
    padding-right:336px; /* clears the fixed ideation panel */
  }
  .notes h4{margin:0 0 8px;font-size:var(--xs);text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
  .notes ul{margin:0;padding-left:16px}
  .notes li{margin-bottom:5px}
  .notes li:last-child{margin-bottom:0}
  .notes .ref{color:var(--text-3);font-style:italic}
  .notes.hidden{display:none}

  /* ---------- app chrome ---------- */
  .rail{width:196px;flex:0 0 196px;background:var(--surface-2);border-right:1px solid var(--line);
    padding:14px 10px;font-size:var(--sm)}
  .rail .brand{display:flex;align-items:center;gap:8px;padding:2px 6px 14px}
  .rail .brand .mark{width:20px;height:20px;border-radius:4px;background:var(--fill-2)}
  .rail .brand .wm{width:64px;height:8px;border-radius:2px;background:var(--fill-2)}
  .rail .grp{margin:12px 0 4px;padding:0 6px;font-size:var(--xs);text-transform:uppercase;
    letter-spacing:.07em;color:var(--text-3)}
  .rail a{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:var(--r);
    color:var(--text-2);text-decoration:none}
  .rail a .dot{width:12px;height:12px;border-radius:3px;background:var(--fill-2);flex:0 0 12px}
  .rail a.on{background:var(--sel);color:var(--text);font-weight:600}
  .rail a.on .dot{background:var(--sel-line)}
  .rail .foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 24px 0}
  .topbar h2{font-size:var(--h1);margin:0;letter-spacing:-.015em}
  .crumb{font-size:var(--sm);color:var(--text-3);margin:0 0 4px}
  .tabs{display:flex;gap:20px;padding:14px 24px 0;border-bottom:1px solid var(--line)}
  .tabs span{padding-bottom:9px;color:var(--text-2);font-size:var(--h4);cursor:default}
  .tabs span.on{color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
  .body{flex:1;overflow:auto;padding:24px}
  .body.tight{padding:20px 24px}

  /* settings takeover rail — replaces the app rail, per settings-nav.tsx */
  .set-rail{width:240px;flex:0 0 240px;background:var(--surface-2);border-right:1px solid var(--line);
    padding:12px 8px;font-size:var(--h4);overflow:auto}
  .set-rail .backlink{display:flex;align-items:center;gap:6px;padding:4px 8px;margin-bottom:14px;
    border-radius:var(--r);color:var(--text-2);font-weight:500;text-decoration:none}
  .set-rail .grp{margin:16px 0 6px;padding:0 8px;font-size:var(--xs);letter-spacing:.02em;
    color:var(--text-2);font-weight:600}
  .set-rail .grp:first-of-type{margin-top:0}
  .set-rail a:not(.backlink){display:block;padding:4px 8px;border-radius:var(--r);
    color:var(--text-2);text-decoration:none;font-weight:500}
  .set-rail a.on{background:var(--sel);color:var(--text)}

  /* settings two-pane */
  .set-wrap{flex:1;display:flex;min-height:0}
  .set-nav{width:216px;flex:0 0 216px;border-right:1px solid var(--line);padding:20px 12px;
    font-size:var(--sm);overflow:auto}
  .set-nav .grp{margin:14px 0 4px;padding:0 8px;font-size:var(--xs);text-transform:uppercase;
    letter-spacing:.07em;color:var(--text-3)}
  .set-nav .grp:first-child{margin-top:0}
  .set-nav a{display:block;padding:5px 8px;border-radius:var(--r);color:var(--text-2);text-decoration:none}
  .set-nav a.on{background:var(--sel);color:var(--text);font-weight:600}

  /* ---------- primitives ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r);
    border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:var(--h4);
    font-family:var(--font);white-space:nowrap}
  .btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.sm{height:26px;font-size:var(--sm);padding:0 9px}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
  .btn .ic{width:11px;height:11px;border-radius:2px;background:currentColor;opacity:.5}

  .field{margin-bottom:16px}
  .label{display:block;font-size:var(--h4);font-weight:600;margin-bottom:5px}
  .hint{font-size:var(--sm);color:var(--text-3);margin:5px 0 0;line-height:1.5}
  .input,.select,.textarea{
    width:100%;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);
    padding:8px 10px;font-size:var(--h4);color:var(--text-2);font-family:var(--font);min-height:34px;
    display:flex;align-items:center;
  }
  .input.ph,.textarea.ph{color:var(--text-3)}
  .select{justify-content:space-between}
  .select:after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
    border-top:5px solid var(--line-2)}
  .textarea{display:block;min-height:112px;line-height:1.6;white-space:pre-wrap}
  /* The two real template prompts are longer than any sheet, so this box always
     scrolls. Size it to the room the sheet has left below the label, so the whole
     box is visible and the schedule sits just under the fold. */
  .textarea.editable{max-height:368px;overflow-y:auto}
  .row{display:flex;gap:10px}
  .row > *{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line-2);
    border-radius:var(--r);padding:6px 8px;min-height:34px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--fill);border:1px solid var(--line);
    border-radius:12px;padding:2px 8px;font-size:var(--sm);color:var(--text-2)}
  .chip .x{color:var(--text-3)}
  .chips .ghosttext{font-size:var(--sm);color:var(--text-3)}

  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:11px;padding:2px 9px;
    font-size:var(--xs);border:1px solid var(--line-2);color:var(--text-2);background:var(--surface-2)}
  .pill .d{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
  .pill.on .d{background:var(--ink)}
  .pill.warn,.pill.err{background:var(--warn-fill);border-color:var(--warn-line)}
  .pill.warn .d,.pill.err .d{background:#a8823c}
  .pill.err{color:#8a6d34}
  .pill.ok{background:var(--surface);border-color:var(--line-2);color:var(--text-2)}
  .pill.ok .d{background:var(--ink)}
  .pill.off{background:var(--surface-2);border-color:var(--line);color:var(--text-3)}
  .pill.off .d{background:var(--line-2)}

  /* Banner — the one place failures are reported. Follows the <Banner> component in
     @conveyorhq/react-components: 4px radius, no border, 12/16 padding, 12px/18px text,
     a 16px icon in its own column at 10px gap, title over description, close top-right.
     Tints and icon colours are the real caution / failure tokens. */
  .banner{position:relative;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;
    border-radius:var(--r);padding:12px 16px;padding-right:72px;margin-bottom:14px}
  .banner.caution{background:#f4f1e8}
  .banner.caution .bicon{color:#9d7300}
  .banner.failure{background:#f4eded}
  .banner.failure .bicon{color:#b7221a}
  .bicon{grid-row:span 2;width:16px;height:16px;margin-top:2px}
  .bt{grid-column:2;font-size:var(--sm);line-height:18px;font-weight:500;color:#204156}
  .bs{grid-column:2;font-size:var(--sm);line-height:18px;color:#162d3c}
  .bs p{margin:0 0 16px}
  .bs p:last-child{margin-bottom:0}
  .bs.rows p{margin-bottom:5px}
  .bname{font-weight:600}
  .blink{text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .bclose{position:absolute;top:10px;right:12px;width:24px;height:24px;color:#86a3b5;
    display:flex;align-items:center;justify-content:center}
  .bclose svg{width:16px;height:16px}

  .toggle{width:30px;height:17px;border-radius:9px;background:var(--fill-2);border:1px solid var(--line-2);
    position:relative;display:inline-block}
  .toggle:after{content:"";position:absolute;top:1px;left:1px;width:13px;height:13px;border-radius:50%;
    background:#fff;border:1px solid var(--line-2)}
  .toggle.on{background:var(--ink);border-color:var(--ink)}
  .toggle.on:after{left:auto;right:1px;border-color:var(--ink)}

  .card{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:16px}
  .sec{border:1px solid var(--line);border-radius:6px;margin-bottom:14px;overflow:hidden}
  .sec > header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);
    display:flex;align-items:center;justify-content:space-between}
  .sec > header h3{margin:0;font-size:var(--h4);font-weight:600}
  .sec > header .step{font-size:var(--xs);color:var(--text-3);text-transform:uppercase;letter-spacing:.07em}
  .sec .in{padding:16px}

  .ph-box{border:1px dashed var(--line-dash);border-radius:var(--r);background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:var(--sm)}
  .bar{height:8px;border-radius:2px;background:var(--fill-2)}
  .bar.s{width:40%} .bar.m{width:65%} .bar.l{width:88%}
  .stack > *{margin-bottom:7px} .stack > *:last-child{margin-bottom:0}

  table.tbl{width:100%;border-collapse:collapse;font-size:var(--h4)}
  table.tbl th{text-align:left;font-size:var(--xs);text-transform:uppercase;letter-spacing:.07em;
    color:var(--text-3);font-weight:600;padding:0 12px 8px;border-bottom:1px solid var(--line)}
  table.tbl th.sortable{cursor:pointer;user-select:none}
  table.tbl th.sortable:hover{color:var(--text-2)}
  table.tbl th.sortable.on{color:var(--text-2)}
  .caretsort{margin-left:5px;font-size:9px;opacity:.55}
  table.tbl th.sortable.on .caretsort{opacity:1}
  table.tbl td{padding:13px 12px;border-bottom:1px solid var(--line);color:var(--text-2);vertical-align:middle}
  table.tbl td.name{color:var(--text);font-weight:600}
  table.tbl td .sub{font-size:var(--sm);color:var(--text-3);font-weight:400;margin-top:2px}
  table.tbl tr.hl td{background:var(--surface-2)}

  .kicker{font-size:var(--xs);text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin:0 0 8px}
  .h3{font-size:var(--h3);font-weight:600;margin:0 0 4px}
  .h2{font-size:var(--h2);font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .muted{color:var(--text-2);font-size:var(--h4);line-height:1.6;margin:0}
  .muted.sm{font-size:var(--sm)}

  /* overlays */
  .scrim{position:absolute;inset:0;background:rgba(28,30,33,.30);display:flex;align-items:center;
    justify-content:center;padding:28px;z-index:5}
  .modal{background:var(--surface);border-radius:8px;width:100%;max-width:620px;max-height:100%;
    display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.22);overflow:hidden}
  .pframe{display:contents}
  .modal > header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;
    align-items:flex-start;justify-content:space-between;gap:12px}
  .modal > header h3{margin:0;font-size:var(--h3);font-weight:600}
  .modal > .mbody{padding:20px;overflow:auto}
  .modal > footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2)}
  .menu{position:absolute;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;min-width:158px;font-size:var(--h4);z-index:4}
  .menu div{padding:7px 10px;border-radius:var(--r);color:var(--text-2)}
  .menu div.sep{border-top:1px solid var(--line);margin:4px 0;padding:0;height:0}

  /* report artifact preview */
  .paper{background:#fff;border:1px solid var(--line-2);box-shadow:0 2px 10px rgba(0,0,0,.07);
    width:520px;padding:34px 38px;margin:0 auto}
  .paper .plogo{width:78px;height:9px;background:var(--fill-2);border-radius:2px;margin-bottom:22px}
  .paper h4{margin:0 0 4px;font-size:var(--h2);letter-spacing:-.01em}
  .paper .pmeta{font-size:var(--sm);color:var(--text-3);margin:0 0 20px}
  .paper .pkick{font-size:var(--xs);text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);
    margin:22px 0 8px}

  .callout{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:12px 14px;
    font-size:var(--sm);color:var(--text-2);line-height:1.55}
  .callout b{color:var(--text)}
  .discl{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:10px 12px;
    font-size:var(--sm);color:var(--text-2);display:flex;gap:8px;align-items:flex-start}

  .scopegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin-top:8px}
  .scopegrid span{font-size:var(--sm);color:var(--text-2);display:flex;gap:7px;align-items:center}
  .scopegrid span:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line-2)}

  /* an editable prompt canvas — full-contrast text, focus ring, caret, resize grip */
  .textarea.editable{
    color:var(--text);background:#fff;position:relative;
    border-color:var(--ink);box-shadow:0 0 0 3px rgba(47,58,69,.09);
    padding:11px 13px;
  }
  .textarea.editable:after{
    content:"";position:absolute;right:4px;bottom:4px;width:7px;height:7px;
    border-right:2px solid var(--line-2);border-bottom:2px solid var(--line-2);
  }
  .textarea.editable.ph,.input.editable.ph{color:var(--text-3)}
  .caret{display:inline-block;width:1.5px;height:15px;background:var(--ink);
    vertical-align:-3px;margin-left:1px}
  .lblrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:3px}
  .lblrow .label{margin-bottom:0}
  .editnote{font-size:var(--sm);color:var(--text-2);margin:0 0 8px}
  .editnote .promptname{font-weight:600;color:var(--text)}
  .btn.icon{width:28px;height:28px;padding:0;justify-content:center;color:var(--text-2);
    font-size:15px;line-height:1}

  .scopeline{font-size:var(--sm);color:var(--text-2);margin:0;line-height:1.5}

  .heropanel{max-width:820px;margin:26px auto 0;border:1px solid var(--line);border-radius:8px;
    background:var(--surface);overflow:hidden}
  .heropanel-foot{border-top:1px solid var(--line);background:var(--surface-2);padding:18px 30px 24px}
  /* manage list */
  .rchips{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .rchip{width:24px;height:24px;border-radius:50%;background:var(--fill-2);border:1px solid var(--line-2);
    display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;
    color:var(--text-2);letter-spacing:.02em;flex:0 0 24px}
  .rchip.ext{background:var(--warn-fill);border-color:var(--warn-line)}
  .rmore{font-size:var(--sm);color:var(--text-3);margin-left:2px}
  .rcount{border-bottom:1px dotted var(--line-2);cursor:default}
  .rcwrap{position:relative;display:inline-block}
  .rcwrap .rtip{top:24px}
  .extbadge{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#8a6d34;
    background:var(--warn-fill);border:1px solid var(--warn-line);border-radius:3px;padding:0 4px}
  .rtip.up{top:auto;bottom:46px}
  .rtip{position:absolute;left:0;top:46px;z-index:6;width:262px;background:#fff;
    border:1px solid var(--line-2);border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.16);overflow:hidden}
  .rtiphead{padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);
    font-size:var(--xs);text-transform:uppercase;letter-spacing:.07em;color:var(--text-3)}
  .rtiplist{max-height:246px;overflow:auto}
  .rtiprow{display:flex;gap:9px;align-items:center;padding:6px 12px}
  .rtiprow .t{font-size:var(--sm);font-weight:600;line-height:1.3}
  .rtiprow .s{font-size:var(--xs);color:var(--text-3)}


  .btn.dis{opacity:.42;pointer-events:none}
  .btn.strong{border-color:var(--ink);color:var(--text);font-weight:600}
  .bodybar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    max-width:520px;margin:0 auto 12px}
  .extcount{color:#8a6d34}
  .spill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);
    background:var(--surface-2);border-radius:12px;padding:3px 8px;font-size:var(--sm);
    color:var(--text-2);cursor:pointer;white-space:nowrap}
  .spill:hover{border-color:var(--line-2);background:var(--fill-2)}
  .spill.ext{background:var(--warn-fill);border-color:var(--warn-line)}
  .spill .x{color:var(--text-3)}

  .quickset{font-size:var(--sm);display:flex;gap:8px;align-items:center}
  .tokenfield{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border:1px solid var(--ink);
    border-radius:var(--r);padding:7px 9px;min-height:40px;background:#fff;
    box-shadow:0 0 0 3px rgba(47,58,69,.09);max-height:132px;overflow-y:auto}
  .tokeninput{flex:1;min-width:150px;border:none;outline:none;font-size:var(--h4);
    font-family:var(--font);color:var(--text);padding:2px 0}
  /* typeahead menu — appears under the field while you type */
  .gmenu{margin-top:5px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;
    box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:236px;overflow-y:auto}
  .gmrow{display:flex;align-items:center;gap:11px;padding:8px 12px;cursor:pointer}
  .gmrow:hover,.gmrow.on{background:var(--surface-2)}
  .gmrow .t{font-size:var(--h4);line-height:1.35;color:var(--text-2)}
  .gmrow .s{font-size:var(--sm);line-height:1.4;color:var(--text-3)}
  .gmrow b{font-weight:600;color:var(--text)}
  .gmempty{padding:11px 12px;font-size:var(--sm);color:var(--text-3);line-height:1.5}

  /* shortcut rows under the field */
  .srows{margin:9px 0 10px;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
  .srow{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;
    background:var(--surface-2);border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:none}
  .srow:hover{background:var(--sel)}
  .srow.on{background:var(--sel);box-shadow:inset 2px 0 0 var(--sel-line)}

   p:`Report on how our Trust Center performed over the reporting period. The reader is the security or GRC owner, who needs to answer three questions: is the Trust Center working, who specifically is looking, and what should I change.

Cover:
• A health snapshot — external interactions, unique visitors, active domains, new connections, document views and downloads, Q&A views, agent conversations, new subscribers.
• Who is visiting — top domains by engagement, with the visitor emails behind each.
• Content performance — the most viewed documents, and any document we expected to matter that is seeing little or no traffic.

• New subscribers and new connections created in the period.

Exclude anyone internal to us from every figure. Never mix internal and external activity in the same number.

After each section, say what the data means rather than restating it. Commit to the interpretation the data supports instead of hedging. If engagement is concentrated in a few accounts, name them and say what their behaviour suggests — a full compliance package downloaded in one session reads as an active security review. Where a visitor asked something the agent could not answer, say whether we are missing the content or failing to surface content we already have.

   p:`Analyse how well ConveyorAI answered customer security questionnaires and RFPs over the reporting period. The audience is the team that maintains the knowledge base behind the answering system — they do not need questionnaires explained. What they need is which entries are wrong, which are missing, and which are costing the most reviewer time.

Cover:
• Scope — how many answers were graded, how many carry no grade at all, and anything excluded.
• The four rates: Perfect, Accurate Edited, Inaccurate, Unanswered. Split Security Questionnaire from RFP when both appear; they fail differently.
• Whether failures cluster in a few questionnaires or spread evenly, and separately whether they cluster by topic. One stale entry surfacing across five customers is a higher-leverage fix than one bad questionnaire.
• Which subjects the AI handles well and badly, named specifically enough to act on.
• Every inaccurate and unanswered answer, grouped by root cause, quoted in full — question, AI draft, final answer.
• The Accurate Edited answers, diffed against their finals, to find the mechanical edits that are one style rule away from Perfect.
• Process and format problems, kept separate from knowledge base problems.

Counting rules:
An answer a human did not edit is Perfect — silence is approval. Count every graded answer with no review-intensity threshold.
Where the AI's text was accepted verbatim and only a structured picklist was wrong, that is a format failure, not a content one. Report the corrected content-inaccuracy rate as the real number.

Read the failures rather than inferring them from metadata. Do not recommend model, prompt or retrieval changes — every recommendation should be a knowledge base content change. Close with a prioritised list ordered by failures resolved per unit of effort, and an "if only three things get done" box.`},

function rail(activeInsights, activeSettings){
  let h = `<nav class="rail"><div class="brand"><div class="mark"></div><div class="wm"></div></div>`;
  RAIL.forEach(sec=>{
    if(sec.g) h += `<div class="grp">${sec.g}</div>`;
    sec.items.forEach(([label,key])=>{
      const on = (key==='insights' && activeInsights) ? ' on':'';
      h += `<a class="${on.trim()}"><span class="dot"></span>${label}</a>`;
    });
  });
  h += `<div class="foot"><a class="${activeSettings?'on':''}"><span class="dot"></span>Settings</a></div></nav>`;
  return h;
}

function settingsNav(){
  let h = `<nav class="set-rail"><a class="backlink">&larr; Back to app</a>`;
  SET_NAV.forEach(([g,items])=>{
    h += `<div class="grp">${g}</div>`;
    items.forEach(i=>{
      const on = i==='Scheduled Insights' ? ' class="on"' : '';
      h += `<a${on}>${i}</a>`;
    });
  });
  return h + `</nav>`;
}

/* ---------- manage list ---------- */
function initials(n){
  if(n.includes('@')) return n.split('@')[0].slice(0,2).toUpperCase();
  return n.split(' ').map(w=>w[0]).slice(0,2).join('');
}

function recipientChips(to, cap){
  const shown = to.slice(0, cap), rest = to.length - shown.length;
  return `<div class="rchips">
    ${shown.map(x=>`<span class="rchip${x.ext?' ext':''}" title="${x.n} · ${x.e}">${initials(x.n)}</span>`).join('')}
    ${rest>0 ? `<span class="rmore">+${rest} more</span>` : ''}
  </div>`;
}

function recipientTip(to, up){
  return `<div class="rtip${up?' up':''}">
    <div class="rtiphead">${to.length} recipients</div>
    <div class="rtiplist">
      ${to.map(x=>`<div class="rtiprow">
        <span class="rchip${x.ext?' ext':''}">${initials(x.n)}</span>
        <div><div class="t">${x.n}${x.ext?' <span class="extbadge">External</span>':''}</div>
          <div class="s">${x.e}</div></div>
      </div>`).join('')}
    </div>
  </div>`;
}

const STATUS_ORDER = {Error:0, Active:1, Paused:2};
const SORTS = {
  name:   r => r.n.toLowerCase(),
  sched:  r => r.s,
  rcp:    r => r.to.length,
  last:   r => r.lt,
  status: r => STATUS_ORDER[r.st]
};

function sortedReports(){
  const key = state.sortKey || 'name';
  const dir = state.sortDir === 'desc' ? -1 : 1;
  const f = SORTS[key] || SORTS.name;
  return [...REPORTS].sort((a,b) => {
    const x = f(a), y = f(b);
    return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });
}

function th(key, label, align){
  const on = (state.sortKey || 'name') === key;
  const dir = state.sortDir === 'desc' ? '▾' : '▴';
  return `<th data-sort="${key}" class="sortable${on?' on':''}"${align?` style="${align}"`:''}>
    ${label}<span class="caretsort">${on ? dir : '↕'}</span></th>`;
}

function statusPill(st){
  const cls = st==='Error' ? ' err' : st==='Paused' ? ' off' : ' ok';
  return `<span class="pill${cls}"><span class="d"></span>${st}</span>`;
}

/* The chip flags WHICH report needs attention. It never says what went wrong —
   that is the banner's job, so the cell stays one short, neutral line. */
function statusCell(r){
  const note = r.st==='Active' ? `Next run ${r.nx}`
             : r.st==='Paused' ? `Since ${r.pd}`
             : `Since ${r.sd}`;
  return `${statusPill(r.st)}<div class="sub">${note}</div>`;
}

/* "Last delivered", not "Last run" — a run that failed delivered nothing, and
   failures belong in the banner rather than in the row. */
function lastRun(r){

/* Severity: a run that failed for some people, or a schedule that cannot run at all,
   is `failure`. A run that produced nothing but will try again is `caution`. */
const ERR_VARIANT = {delivery:'failure', generation:'caution', prompt:'failure', many:'failure'};

function errorBanner(){
  const R_DEL = REPORTS.find(r=>r.fail && r.fail.kind==='delivery');
  const R_GEN = REPORTS.find(r=>r.fail && r.fail.kind==='generation');
  const R_PRM = REPORTS.find(r=>r.fail && r.fail.kind==='prompt');
  const K = state.errkind, V = ERR_VARIANT[K];
  const link = t => `<span class="blink">${t}</span>`;
  const name = r => `<span class="bname">${r.n}</span>`;
  let title, desc;

  if(K==='delivery'){
    title = `${name(R_DEL)} didn\u2019t reach everyone`;
    desc  = `<p>Sep 2, 2026 \u2014 2 of 7 addresses bounced. Everyone else received it. ${link('Fix recipients')}</p>`;
  }
  else if(K==='generation'){
    title = `${name(R_GEN)} couldn\u2019t be generated`;
    desc  = `<p>Aug 15, 2026 \u2014 no data for the period, so nothing was sent. ${link('View run')}</p>`;
  }
  else if(K==='prompt'){
    title = `${name(R_PRM)} can\u2019t run as written`;
    desc  = `<p>Sep 5, 2026 \u2014 the prompt asks for data Conveyor doesn\u2019t hold, so the schedule is held. ${link('Edit prompt')}</p>`;
  }
  else {
    title = '3 scheduled reports need attention';
    desc  = `<p>${name(R_DEL)} \u2014 delivery failed, 2 of 7 addresses bounced. ${link('Fix recipients')}</p>
      <p>${name(R_GEN)} \u2014 generation failed, no data for the period. ${link('View run')}</p>
      <p>${name(R_PRM)} \u2014 held, the prompt asks for data Conveyor doesn\u2019t hold. ${link('Edit prompt')}</p>`;
  }

  return `<div class="banner ${V}" role="alert">
    ${bIcon(V, 'bicon')}
    <div class="bt">${title}</div>
    <div class="bs${K==='many' ? ' rows' : ''}">${desc}</div>
    <span class="bclose">${bIcon('close','')}</span>
  </div>`;
}

/* ============================================================
   SEND TO — one selection set. "Only me" and "Everyone" are shortcuts
   onto it; "Choose people" is that same set, edited by hand. Unchecking
   anywhere simply stops matching a shortcut.
   ============================================================ */
const ME = 'o12';
const ORG_IDS = ORG.map((_,i)=>'o'+i);
const REPORT_IDS = ORG_IDS.slice(0,13).concat(['x0','x1']);

/* The modal opens with the report's own recipients already selected. */
if(state.picked === null) state.picked = [...REPORT_IDS];

function directory(){
  return ORG.map((p,i)=>({...p, id:'o'+i}))
    .concat(EXT.map((p,i)=>({...p, id:'x'+i})))
    .concat(state.extras);
}

/* "Only me" and "Everyone at Acme" are shortcuts onto the one selection set,
   not modes — the chips simply light up when the set happens to match. */
function isOnlyMe(){
  return state.picked.length===1 && state.picked[0]===ME;
}

function isEveryone(){
  return state.picked.length===ORG_IDS.length
      && ORG_IDS.every(id => state.picked.includes(id));
}

/* Bold the typed run inside a name or address, the way Gmail does. */
function mark(text, q){
  if(!q) return text;
  const i = text.toLowerCase().indexOf(q);
  if(i < 0) return text;
  return text.slice(0,i) + '<b>' + text.slice(i, i+q.length) + '</b>' + text.slice(i+q.length);
}

/* The typeahead menu. It only exists while you are typing. */
function menuRows(){
  const q = (state.q||'').trim().toLowerCase();
  if(!q) return '';

  const hits = directory()
    .filter(x => !state.picked.includes(x.id))
    .filter(x => x.n.toLowerCase().includes(q) || x.e.toLowerCase().includes(q))
    .slice(0, 6);

  const isEmail = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(q);
  const known = directory().some(x => x.e.toLowerCase() === q);
  const addRow = (isEmail && !known) ? `<div class="gmrow" data-add="${q}">
      <span class="addplus">＋</span>
      <div><div class="t">Add <b>${q}</b></div>
        <div class="s">Not in Acme · will be sent as an external recipient</div></div>
    </div>` : '';

  const rows = hits.map((x,i) => `<div class="gmrow${i===0 && !addRow ? ' on' : ''}" data-toggle="${x.id}">
      <span class="rchip${x.ext?' ext':''}">${initials(x.n)}</span>
      <div><div class="t">${mark(x.n, q)}${x.ext?' <span class="extbadge">External</span>':''}</div>
        <div class="s">${mark(x.e, q)}</div></div>
    </div>`).join('');

  const body = addRow + rows;
  return `<div class="gmenu">${body || `<div class="gmempty">No one matches
    \u201c${q}\u201d. Type a full email address to invite someone outside Acme.</div>`}</div>`;
}

/* One pattern: the field holds the recipients, and typing opens a menu under it. */
function sendPattern(sel, n, extN){
  const q = state.q || '';
  return `<div class="lblrow">
      <label class="label">Send to</label>
      <span class="muted sm">Sending to ${n}${extN
        ? ` · <span class="extcount">${extN} external</span>` : ''}</span>
    </div>
    <div class="tokenfield" id="tokenfield">
      ${sel.map(x=>`<span class="spill${x.ext?' ext':''}" data-toggle="${x.id}">
        ${x.ext ? x.e : x.n}<span class="x">×</span></span>`).join('')}
      <input class="tokeninput" id="pplsearch" value="${q}" autocomplete="off"
        placeholder="${n ? '' : 'Type a name or email address'}" />
    </div>
    <div id="pplmenu">${menuRows()}</div>
    <div class="srows">
      <div class="srow${isOnlyMe()?' on':''}" data-preset="me">
        <span class="cbox${isOnlyMe()?' on':''}"></span>
        <span class="rchip">You</span>
        <span class="t">Only me</span>
        <span class="s">ivana.tso@conveyor.com</span>
      </div>
      <div class="srow${isEveryone()?' on':''}" data-preset="all">
        <span class="cbox${isEveryone()?' on':''}"></span>
        <span class="rchip">All</span>
        <span class="t">Send to all</span>
        <span class="s">Everyone at Acme · ${ORG_IDS.length} users</span>
      </div>
    </div>
    <p class="hint">Type a name to find someone in Acme, or a full email address to send
      to someone outside it. Anyone added here gets this report only — the schedule does not change.</p>
    </div>`;
}

function sendModal(){
  const r = REPORTS[0];
  const n = state.picked.length;
  const extN = state.picked.filter(id => !id.startsWith('o')).length;
  const byId = Object.fromEntries(directory().map(x => [x.id, x]));
  const sel = state.picked.map(id => byId[id]).filter(Boolean);
  return `<div class="scrim"><div class="modal">
    <header>
      <div><h3>Send this report now</h3>
      <p class="muted sm" style="margin-top:4px">${r.n}, generated from your current data.</p></div>
      <span style="color:var(--text-3)">×</span>
    </header>
    <div class="mbody">
      ${sendPattern(sel, n, extN)}

    <footer>
      <span class="muted sm" style="color:var(--text-3)">Recipients receive it within a few minutes.</span>
      <div style="display:flex;gap:8px">
        <button class="btn">Cancel</button>
        <button class="btn pri">Send report</button>
      </div>
    </footer>
  </div></div>`;
}

function scManage(){
  const over = state.overlay==='send';
  return frame(listContent(over), {}) + (over ? sendModal() : '');
}

/* ============================================================

   ============================================================ */
const RENDER = {empty:scEmpty, templates:scTemplates, configure:scConfigure, preview:scPreview, manage:scManage};

/* Which option groups belong to which screen. Anything not listed stays hidden. */
const SUBS = {
  empty:     [],
  templates: [],
  configure: [{gl:'Prompt source', items:()=>SOURCES_OF_PROMPT, key:'source'}],
  preview:   [{gl:'Test run',       items:()=>TESTRUNS, key:'testrun'},
],
  manage:    [{gl:'Overlay',         items:()=>OVERLAYS, key:'overlay'},
              {gl:'Error type',      items:()=>ERRKINDS, key:'errkind',
               under:{key:'overlay', val:'error'}}]
};

/* A sub-group is visible when its own condition passes and, if it hangs off another
   option, when that option is the one selected. */
function subVisible(g){
  return (!g.when || g.when()) && (!g.under || state[g.under.key] === g.under.val);
}

/* `nested` maps an option id to markup shown directly beneath that option, so a
   dependent group sits under the thing it depends on rather than after the whole list. */
function segHTML(items, key, nested){
  return `<div class="seg stack">` + items.map(i =>
    `<button data-k="${key}" data-v="${i.id}" class="${state[key]===i.id?'on':''}">${i.label}</button>`
    + ((nested && nested[i.id]) || '')
  ).join('') + `</div>`;
}

function sgrpHTML(g){
  return `<div class="sgrp"><div class="gl">${g.gl}</div>${segHTML(g.items(), g.key)}</div>`;
}

/* Sub-options render inline, directly under the screen they belong to. */
function buildPanel(){
  let h = `<div class="grp"><div class="gl">Navigation placement</div>
    ${segHTML(PLACEMENTS,'placement')}</div>`;

  h += `<div class="grp"><div class="gl">Screen</div><div class="seg stack">`;
  SCREENS.forEach(sc => {
    h += `<button data-k="screen" data-v="${sc.id}" class="${state.screen===sc.id?'on':''}">${sc.label}</button>`;
    const subs = SUBS[sc.id] || [];
    const shown = subs.filter(subVisible);
    if(state.screen===sc.id && shown.length){
      const tops  = shown.filter(g => !g.under);
      const kids  = shown.filter(g => g.under);
      h += `<div class="subs">` + tops.map(g => {
        const mine = kids.filter(k => k.under.key === g.key);
        const nested = {};
        mine.forEach(k => { nested[k.under.val] = `<div class="subs">${sgrpHTML(k)}</div>`; });
        return `<div class="sgrp"><div class="gl">${g.gl}</div>${
          segHTML(g.items(), g.key, nested)}</div>`;
      }).join('') + `</div>`;
    }
  });
  h += `</div></div>`;

  const body = document.getElementById('ctlbody');
  body.innerHTML = h;
  [...body.querySelectorAll('button')].forEach(b => {
    b.onclick = () => { state[b.dataset.k] = b.dataset.v; render(); };
  });
}

function render(){
  document.getElementById('stage').innerHTML = RENDER[state.screen]();

  const p = PLACEMENTS.find(x=>x.id===state.placement).label;
  const s = SCREENS.find(x=>x.id===state.screen).label;
  const v = state.screen==='configure'
    ? ' · ' + SOURCES_OF_PROMPT.find(x=>x.id===state.source).label
    : state.screen==='preview' ? ' · ' + TESTRUNS.find(x=>x.id===state.testrun).label

    : state.screen==='manage' ? ' · ' + OVERLAYS.find(x=>x.id===state.overlay).label
        + (state.overlay==='error' ? ' · ' + ERRKINDS.find(x=>x.id===state.errkind).label : '')
    : '';
  document.getElementById('ablabel').innerHTML = `<b>${p}</b> · ${s}${v}`;
  document.getElementById('combo').textContent =
    state.placement==='insights' ? 'A' : 'B';

  const notes = document.getElementById('notes');
  notes.innerHTML = currentNotes();
  notes.classList.toggle('hidden', !state.notes);

  buildPanel();
}

/* Anything in the artboard carrying data-set="key:value" drives state, so wireframe
   controls can be genuinely clickable without wiring each one by hand. */
document.getElementById('stage').addEventListener('click', e => {
  const set = e.target.closest('[data-set]');
  if(set){
    const [k, v] = set.dataset.set.split(':');
    state[k] = v; render(); return;
  }

  const pre = e.target.closest('[data-preset]');
  if(pre){
    const m = pre.dataset.preset;
    if(m==='me'){
      if(isOnlyMe()){
        state.picked = (state.prevPicked && state.prevPicked.length)
          ? state.prevPicked : [...REPORT_IDS];
      } else {
        state.prevPicked = state.picked;
        state.picked = [ME];
      }
    }
    if(m==='all'){
      if(isEveryone()){
        state.picked = (state.prevPicked && state.prevPicked.length)
          ? state.prevPicked : [...REPORT_IDS];
      } else {
        state.prevPicked = state.picked;
        state.picked = [...ORG_IDS];
      }
    }
    if(m==='none') state.picked = [];
    state.q = '';
    render();
    document.getElementById('pplsearch')?.focus();
    return;
  }

  /* Unchecking is not a special case — the selection simply stops matching
     "Only me", and the row un-highlights on its own. */
  const tog = e.target.closest('[data-toggle]');
  if(tog){
    const id = tog.dataset.toggle;
    const inMenu = !!e.target.closest('#pplmenu');
    state.picked = state.picked.includes(id)
      ? state.picked.filter(x => x !== id)
      : state.picked.concat(id);
    if(inMenu) state.q = '';
    render();
    if(inMenu) document.getElementById('pplsearch')?.focus();
    return;
  }

  const tm = e.target.closest('[data-tmpl]');
  if(tm){
    state.tmpl = +tm.dataset.tmpl;
    state.source = state.tmpl === -1 ? 'scratch' : 'template';
    render(); return;
  }

  const sort = e.target.closest('[data-sort]');
  if(sort){
    const k = sort.dataset.sort;
    if((state.sortKey||'name') === k){
      state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
    } else { state.sortKey = k; state.sortDir = 'asc'; }
    render(); return;
  }

  const add = e.target.closest('[data-add]');
  if(add){
    const mail = add.dataset.add;
    const id = 'e' + state.extras.length;
    state.extras = state.extras.concat({n:mail, e:mail, ext:true, id});
    state.picked = state.picked.concat(id);
    state.q = '';
    render();
    document.getElementById('pplsearch')?.focus();
  }
});

/* Typing rebuilds the menu in place so the field keeps focus and the caret.
   The container is always in the DOM, so the first keystroke has somewhere to go. */
document.getElementById('stage').addEventListener('input', e => {
  if(e.target.id !== 'pplsearch') return;
  state.q = e.target.value;
  const menu = document.getElementById('pplmenu');
  if(menu) menu.innerHTML = menuRows();
});

/* Enter takes the highlighted row; Backspace on an empty field removes the last chip. */
document.getElementById('stage').addEventListener('keydown', e => {
  if(e.target.id !== 'pplsearch') return;
  if(e.key === 'Enter'){
    const first = document.querySelector('#pplmenu .gmrow');
    if(first){ first.click(); e.preventDefault(); }
    return;
  }
  if(e.key === 'Backspace' && !e.target.value && state.picked.length){
    state.picked = state.picked.slice(0, -1);
    render();
    document.getElementById('pplsearch')?.focus();
    e.preventDefault();
  }
});

document.getElementById('noteToggle').onchange = e=>{ state.notes = e.target.checked; render(); };

/* Every sub-option on the current screen, flattened, so ↑ ↓ can walk them
   one setting at a time without the panel. */
function subSequence(){
  const groups = (SUBS[state.screen] || []).filter(subVisible);
  const out = [];
  groups.forEach(g => g.items().forEach(o => out.push([g.key, o.id])));
  return out;
}

document.addEventListener('keydown', e=>{
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;  /* let people type */

  const i = SCREENS.findIndex(s=>s.id===state.screen);
  if(e.key==='ArrowRight'){
    state.screen = SCREENS[(i+1)%SCREENS.length].id; state.subIdx = 0; render(); e.preventDefault();
  }
  if(e.key==='ArrowLeft'){
    state.screen = SCREENS[(i-1+SCREENS.length)%SCREENS.length].id; state.subIdx = 0; render(); e.preventDefault();
  }

  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    const seq = subSequence();
    if(!seq.length) return;
    const step = e.key==='ArrowDown' ? 1 : -1;
    /* skip past entries that are already the current value, so every press changes something */
    let idx = state.subIdx || 0;
    for(let n = 0; n < seq.length; n++){
      idx = (idx + step + seq.length) % seq.length;
      const [key, val] = seq[idx];
      if(state[key] !== val){ state[key] = val; break; }
    }
    state.subIdx = idx;
    render(); e.preventDefault();
  }
});

render();
</script>
