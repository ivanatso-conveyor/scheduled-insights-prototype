<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 25 520 298" width="520" height="298" role="img" aria-labelledby="title desc"><title id="title">Tight Constellation</title><desc id="desc">A report illustration surrounded by abstract table, bar chart, line chart, and text modules.</desc><defs><filter id="shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#002118" flood-opacity=".09"/></filter><radialGradient id="wash" cx=".35" cy=".2" r="1"><stop stop-color="#FEFDFB"/><stop offset=".72" stop-color="#FBF9F5"/><stop offset="1" stop-color="#F7F3EE"/></radialGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".96"/><stop offset="1" stop-color="#fff" stop-opacity=".76"/></linearGradient><linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#008661"/><stop offset="1" stop-color="#8000DF"/></linearGradient></defs><style><![CDATA[.card{filter:url(#shadow)}
  @keyframes reportBreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.reportFloat{animation:reportBreathe 6.8s ease-in-out infinite}
  @keyframes floatA{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(3px,-7px) rotate(1.2deg)}}@keyframes floatB{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-4px,6px) rotate(-1.4deg)}}@keyframes floatC{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(5px,4px) rotate(.8deg)}}@keyframes floatD{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-3px,-6px) rotate(-1deg)}}.floatA,.floatB,.floatC,.floatD{transform-box:fill-box;transform-origin:center}.floatA{animation:floatA 5.8s ease-in-out infinite}.floatB{animation:floatB 6.4s ease-in-out infinite}.floatC{animation:floatC 5.3s ease-in-out infinite}.floatD{animation:floatD 6.9s ease-in-out infinite}
  @keyframes barRise{0%,14%{transform:scaleY(.2)}50%,84%{transform:scaleY(1)}96%,100%{transform:scaleY(.2)}}.bar{transform-box:fill-box;transform-origin:bottom;animation:barRise 5.8s cubic-bezier(.2,.85,.3,1) infinite}.bar2{animation-delay:.2s}.bar3{animation-delay:.4s}.bar4{animation-delay:.6s}
  @keyframes drawLine{0%,12%{stroke-dashoffset:120;opacity:.2}52%,86%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:-20;opacity:.2}}.lineDraw{stroke-dasharray:120;animation:drawLine 6.2s ease-in-out infinite}
  @keyframes textIn{0%,12%{opacity:.2;transform:scaleX(.25)}45%,88%{opacity:1;transform:scaleX(1)}98%,100%{opacity:.2;transform:scaleX(.25)}}.textLine{transform-box:fill-box;transform-origin:left;animation:textIn 6.3s cubic-bezier(.2,.8,.3,1) infinite}.text2{animation-delay:.18s}.text3{animation-delay:.36s}.text4{animation-delay:.54s}
  @keyframes cellPulse{0%,100%{opacity:.38}50%{opacity:.92}}.cellAccent{animation:cellPulse 4.8s ease-in-out infinite}
  @keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 28s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-32}}.dash{stroke-dasharray:3 7;animation:dash 4s linear infinite}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes sharpDraw{0%,14%{stroke-dashoffset:1;opacity:.15}39%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:-1;opacity:.15}}.sharpLine{stroke-dasharray:1;animation:sharpDraw 5.6s cubic-bezier(.45,0,.2,1) infinite}@keyframes sharpPoint{0%,18%{opacity:0;transform:scale(.35)}34%,88%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(.5)}}.sharpPoint{transform-box:fill-box;transform-origin:center;animation:sharpPoint 5.6s cubic-bezier(.2,.9,.3,1.2) infinite}.sp2{animation-delay:.08s}.sp3{animation-delay:.16s}.sp4{animation-delay:.24s}.sp5{animation-delay:.32s}.sp6{animation-delay:.4s}.sp7{animation-delay:.48s}@keyframes rankIn{0%,14%{opacity:0;transform:translateX(-5px)}38%,88%{opacity:1;transform:none}97%,100%{opacity:0}}.rankRow{animation:rankIn 5.9s cubic-bezier(.2,.8,.3,1) infinite}.rr2{animation-delay:.16s}.rr3{animation-delay:.32s}]]></style><rect x="1" y="26" width="518" height="296" rx="24" fill="url(#wash)"/><g fill="none" stroke="#D2C7B8" stroke-width="1.2" stroke-dasharray="3 6"><path d="M132 101L188 116"/><path d="M390 103L334 117"/><path d="M140 261L187 225"/><path d="M379 261L335 226"/></g><g transform="translate(170 49)"><g class="reportFloat"><rect class="card" width="180" height="250" rx="15" fill="#fff" stroke="#DED5C9"/><rect x="22" y="22" width="68" height="8" rx="3" fill="#008661"/><rect x="22" y="41" width="119" height="5" rx="2" fill="#8000DF" fill-opacity=".28"/><g opacity=".48"><rect x="22" y="67" width="62" height="49" rx="7" fill="#E1C0F9"/><rect x="96" y="67" width="62" height="49" rx="7" fill="#1DEAB4" fill-opacity=".48"/><rect x="22" y="129" width="136" height="44" rx="7" fill="#F1ECE5"/><rect x="22" y="184" width="136" height="40" rx="7" fill="#F5F0E9"/></g></g></g><g transform="translate(35 71) rotate(-4 57 34)"><g class="floatA"><rect class="card" width="114" height="68" rx="11" fill="url(#glass)" stroke="#DED5C9"/><rect x="14" y="11" width="42" height="5" rx="2" fill="#008661" fill-opacity=".68"/><path d="M15 55H100M20 24V55" stroke="#DDD4C8" stroke-width="1"/><path class="sharpLine" pathLength="1" d="M20 49L33 43L46 48L60 31L73 37L87 22L100 28" fill="none" stroke="url(#lineGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle class="sharpPoint sp1" cx="20" cy="49" r="2.8" fill="#fff" stroke="#008661" stroke-width="1.6"/><circle class="sharpPoint sp2" cx="33" cy="43" r="2.8" fill="#fff" stroke="#8000DF" stroke-width="1.6"/><circle class="sharpPoint sp3" cx="46" cy="48" r="2.8" fill="#fff" stroke="#008661" stroke-width="1.6"/><circle class="sharpPoint sp4" cx="60" cy="31" r="2.8" fill="#fff" stroke="#8000DF" stroke-width="1.6"/><circle class="sharpPoint sp5" cx="73" cy="37" r="2.8" fill="#fff" stroke="#008661" stroke-width="1.6"/><circle class="sharpPoint sp6" cx="87" cy="22" r="2.8" fill="#fff" stroke="#8000DF" stroke-width="1.6"/><circle class="sharpPoint sp7" cx="100" cy="28" r="2.8" fill="#fff" stroke="#008661" stroke-width="1.6"/></g></g><g transform="translate(389 69) rotate(4 48 39)"><g class="floatB"><rect class="card" width="96" height="78" rx="11" fill="url(#glass)" stroke="#DED5C9"/><rect x="13" y="11" width="34" height="5" rx="2" fill="#8000DF" fill-opacity=".72"/><path d="M15 64H82" stroke="#D8CDBB" stroke-width="1.5"/><g class="bar"><rect x="23" y="45" width="11" height="19" rx="2" fill="#D8CDBB"/></g><g class="bar bar2"><rect x="39" y="35" width="11" height="29" rx="2" fill="#E1C0F9"/></g><g class="bar bar3"><rect x="55" y="23" width="11" height="41" rx="2" fill="#008661"/></g><g class="bar bar4"><rect x="71" y="41" width="9" height="23" rx="2" fill="#8000DF" fill-opacity=".62"/></g></g></g><g transform="translate(42 224) rotate(3 51 35)"><g class="floatC"><rect class="card" width="102" height="70" rx="11" fill="url(#glass)" stroke="#DED5C9"/><rect x="13" y="11" width="38" height="5" rx="2" fill="#008661"/><rect x="13" y="22" width="76" height="2" rx="1" fill="#DDD4C8"/><g class="rankRow rr1"><circle cx="18" cy="32" r="3" fill="#008661"/><rect x="26" y="29.5" width="31" height="5" rx="1.5" fill="#CEC4B5"/><rect x="65" y="29.5" width="24" height="5" rx="1.5" fill="#E1C0F9"/></g><g class="rankRow rr2"><circle cx="18" cy="44" r="3" fill="#8000DF"/><rect x="26" y="41.5" width="25" height="5" rx="1.5" fill="#D9D0C3"/><rect x="59" y="41.5" width="30" height="5" rx="1.5" fill="#1DEAB4" fill-opacity=".58"/></g><g class="rankRow rr3"><circle cx="18" cy="56" r="3" fill="#C1B5A5"/><rect x="26" y="53.5" width="37" height="5" rx="1.5" fill="#D9D0C3"/><rect x="71" y="53.5" width="18" height="5" rx="1.5" fill="#E1C0F9"/></g></g></g><g transform="translate(363 225) rotate(-3 58 35)"><g class="floatD"><rect class="card" width="116" height="70" rx="11" fill="url(#glass)" stroke="#DED5C9"/><rect class="textLine" x="15" y="13" width="45" height="6" rx="2" fill="#008661"/><rect class="textLine text2" x="15" y="28" width="84" height="4" rx="1.5" fill="#C9BFAF"/><rect class="textLine text3" x="15" y="39" width="75" height="4" rx="1.5" fill="#E1C0F9"/><rect class="textLine text4" x="15" y="50" width="58" height="4" rx="1.5" fill="#D8CDBB"/></g></g></svg>