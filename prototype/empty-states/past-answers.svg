      <circle cx="34" cy="21" r="3.5" fill="var(--c1)"/><rect x="38" y="20.2" width="6" height="1.6" rx="0.8" fill="var(--sk2)"/></g>
      <g><rect class="card" x="44" y="38" width="62" height="26" rx="3.5" fill="var(--paper)"/>
      <rect x="50" y="44" width="10" height="3.5" rx="1.1" fill="var(--sk2)"/>
      <rect x="50" y="50.5" width="34" height="4.5" rx="1.1" fill="var(--sk)"/>
      <rect x="50" y="57" width="22" height="4.5" rx="1.1" fill="var(--c2)"/>
      <circle cx="34" cy="51" r="3.5" fill="var(--c1)"/><rect x="38" y="50.2" width="6" height="1.6" rx="0.8" fill="var(--sk2)"/></g>
      <g><rect class="card" x="44" y="68" width="62" height="26" rx="3.5" fill="var(--paper)"/>
      <rect x="50" y="74" width="10" height="3.5" rx="1.1" fill="var(--sk2)"/>
      <rect x="50" y="80.5" width="34" height="4.5" rx="1.1" fill="var(--sk)"/>
      <rect x="50" y="87" width="22" height="4.5" rx="1.1" fill="var(--c2)"/>
      <circle cx="34" cy="81" r="3.5" fill="var(--c1)"/><rect x="38" y="80.2" width="6" height="1.6" rx="0.8" fill="var(--sk2)"/></g>
      <g><rect class="card" x="44" y="98" width="62" height="26" rx="3.5" fill="var(--paper)"/>
      <rect x="50" y="104" width="10" height="3.5" rx="1.1" fill="var(--sk2)"/>
      <rect x="50" y="110.5" width="34" height="4.5" rx="1.1" fill="var(--sk)"/>
      <rect x="50" y="117" width="22" height="4.5" rx="1.1" fill="var(--c2)"/>
      <circle cx="34" cy="111" r="3.5" fill="var(--c1)"/><rect x="38" y="110.2" width="6" height="1.6" rx="0.8" fill="var(--sk2)"/></g>
      <g><rect class="card" x="44" y="128" width="62" height="26" rx="3.5" fill="var(--paper)"/>
      <rect x="50" y="134" width="10" height="3.5" rx="1.1" fill="var(--sk2)"/>
      <rect x="50" y="140.5" width="34" height="4.5" rx="1.1" fill="var(--sk)"/>
      <rect x="50" y="147" width="22" height="4.5" rx="1.1" fill="var(--c2)"/>
      <circle cx="34" cy="141" r="3.5" fill="var(--c1)"/><rect x="38" y="140.2" width="6" height="1.6" rx="0.8" fill="var(--sk2)"/></g>
      </g></g>
      <g stroke="var(--xline)" stroke-width="0.85" fill="none" stroke-linecap="round"><path d="M34 14V116"/></g>
  </g>
</svg>
