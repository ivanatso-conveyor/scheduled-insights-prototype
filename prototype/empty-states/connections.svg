    .w-d2{animation-delay:.16s;}
    .w-d3{animation-delay:.32s;}
    .w-d4{animation-delay:.48s;}
    .w-d5{animation-delay:.64s;}
    @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
