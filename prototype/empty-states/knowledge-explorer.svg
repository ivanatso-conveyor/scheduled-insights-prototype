<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130"
     role="img" aria-label="Conveyor empty state — Knowledge explorer — coverage grid">
  <title>Conveyor empty-state motion artwork — Knowledge explorer — coverage grid (Warm Sand)</title>
  <style><![CDATA[
    svg{
      --paper:#FFFFFF; --halo:rgba(255,255,255,.45); --txt2:#5a6b66;
      --grid:#DDD4C8; --xline:rgba(150,135,113,.6); --ink:#002118; --ink2:#004331;
      --c1:#008661; --c2:#1DEAB4; --c3:#D8CDBB; --c4:#C1B5A5; --c5:#EFE9E1;
      --acc:#8000DF; --acc2:#E1C0F9; --acc3:#ECE1F5; --pop:#FFB042;
      --sk:#E7E0D6; --sk2:#D3C9BA; --sk3:#F1EBE2; --sk4:#FAF6F0; --ghost:#C1B5A5;
      --bg1:#FBF8F3; --bg2:#F3EDE4; --bg3:#EDE5D9;
      --blu:#1668C4; --blu2:#A9C8EE; --blu3:#E6EEF9;
    }
    .card{filter:drop-shadow(0 1px 2px rgba(0,33,24,.08));}
    @keyframes ke-cellOn{0%,4%{opacity:0; transform:scale(.6);} 14%,90%{opacity:1; transform:scale(1);} 96%,100%{opacity:0; transform:scale(1);}}
    @keyframes ke-curIn{0%{transform:translate(16px,20px) scale(1); opacity:0;} 6%{opacity:1;} 14%{transform:translate(0,0) scale(1);} 18%{transform:translate(0,0) scale(.86);} 22%{transform:translate(0,0) scale(1);} 38%{transform:translate(9px,11px) scale(1); opacity:1;} 50%,100%{transform:translate(18px,22px) scale(1); opacity:0;}}
    @keyframes ke-gapIn{0%,58%{opacity:0; transform:scale(.85);} 70%,90%{opacity:1; transform:scale(1);} 98%,100%{opacity:0; transform:scale(1);}}
    @keyframes ke-scanX{0%,18%{transform:translateX(0); opacity:0;} 22%{opacity:.9;} 62%{transform:translateX(70px); opacity:.9;} 72%,100%{transform:translateX(70px); opacity:0;}}
    @keyframes w-bang{0%,58%{opacity:0; transform:scale(.7);} 70%,90%{opacity:1; transform:scale(1);} 98%,100%{opacity:0;}}
    .card{filter:drop-shadow(0 1px 2px rgba(0,33,24,.08));}
    .ke-cell{transform-box:fill-box; transform-origin:center; animation:ke-cellOn 4.8s cubic-bezier(.2,.9,.3,1.25) infinite both;}
    .ke-scan{transform-box:fill-box; transform-origin:left; animation:ke-scanX 4.8s cubic-bezier(.2,.8,.3,1) infinite;}
    .ke-gap48{transform-box:fill-box; transform-origin:center; animation:ke-gapIn 4.8s cubic-bezier(.2,.9,.3,1.25) infinite both;}
    .ke-cur{transform-box:fill-box; transform-origin:top left; animation:ke-curIn 4.8s ease-in-out infinite;}
    .w-bang{transform-box:fill-box; transform-origin:center; animation:w-bang 4.8s cubic-bezier(.2,.9,.3,1.25) infinite both;}
    @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
  ]]></style>
  <defs>
    <radialGradient id="wash" cx="0.3" cy="0.2" r="1.1"><stop offset="0" stop-color="#FBF8F3"/><stop offset="0.7" stop-color="#F3EDE4"/><stop offset="1" stop-color="#EDE5D9"/></radialGradient>
  </defs>
  <rect width="130" height="130" rx="8" fill="url(#wash)"/>
  <g>
      <rect x="12" y="12" width="106" height="106" rx="9" fill="var(--halo)"/>
      <rect class="card" x="22" y="20" width="86" height="84" rx="5" fill="var(--paper)"/>
      <rect x="32" y="27" width="44" height="12" rx="4" fill="var(--c5)"/>
      <rect x="37" y="30.5" width="24" height="5" rx="1.1" fill="var(--c1)" opacity=".5"/>
      <rect x="32" y="46" width="14" height="14" rx="2" fill="var(--sk3)"/><rect x="50" y="46" width="14" height="14" rx="2" fill="var(--sk3)"/><rect x="68" y="46" width="14" height="14" rx="2" fill="var(--sk3)"/><rect x="86" y="46" width="14" height="14" rx="2" fill="var(--sk3)"/>
      <rect x="32" y="64" width="14" height="14" rx="2" fill="var(--sk3)"/><rect x="50" y="64" width="14" height="14" rx="2" fill="var(--sk3)"/><rect x="68" y="64" width="14" height="14" rx="2" fill="var(--sk)"/><rect x="86" y="64" width="14" height="14" rx="2" fill="var(--sk3)"/>
      <rect x="32" y="82" width="14" height="14" rx="2" fill="var(--sk3)"/><rect x="50" y="82" width="14" height="14" rx="2" fill="var(--sk)"/><rect x="68" y="82" width="14" height="14" rx="2" fill="var(--sk3)"/><rect x="86" y="82" width="14" height="14" rx="2" fill="var(--sk3)"/>
      <rect class="ke-cell" style="animation-delay:.95s" x="32" y="46" width="14" height="14" rx="2" fill="var(--c1)"/>
      <rect class="ke-cell" style="animation-delay:.95s" x="32" y="64" width="14" height="14" rx="2" fill="var(--c2)"/>
      <rect class="ke-cell" style="animation-delay:.95s" x="32" y="82" width="14" height="14" rx="2" fill="var(--c1)"/>
      <rect class="ke-cell" style="animation-delay:1.5s" x="50" y="46" width="14" height="14" rx="2" fill="var(--c2)"/>
      <rect class="ke-cell" style="animation-delay:1.5s" x="50" y="64" width="14" height="14" rx="2" fill="var(--c1)"/>
      <rect class="ke-cell" style="animation-delay:2.02s" x="68" y="46" width="14" height="14" rx="2" fill="var(--c1)"/>
      <rect class="ke-cell" style="animation-delay:2.02s" x="68" y="82" width="14" height="14" rx="2" fill="var(--c1)"/>
      <rect class="ke-cell" style="animation-delay:2.55s" x="86" y="46" width="14" height="14" rx="2" fill="var(--c1)"/>
      <rect class="ke-cell" style="animation-delay:2.55s" x="86" y="64" width="14" height="14" rx="2" fill="var(--c2)"/>
      <rect class="ke-cell" style="animation-delay:2.55s" x="86" y="82" width="14" height="14" rx="2" fill="var(--c1)"/>
      <rect class="ke-scan" opacity="0" x="31" y="46" width="2" height="50" rx="1.1" fill="var(--c1)"/>
      <g class="ke-gap48"><rect x="68" y="64" width="14" height="14" rx="2" fill="none" stroke="var(--sk2)" stroke-width="1.6" stroke-dasharray="4 3"/></g>
      <g class="ke-gap48" style="animation-delay:.12s"><rect x="50" y="82" width="14" height="14" rx="2" fill="none" stroke="var(--sk2)" stroke-width="1.6" stroke-dasharray="4 3"/></g>
      <g class="w-bang"><rect x="74.1" y="66.2" width="1.8" height="5.8" rx="0.8" fill="var(--txt2)"/><circle cx="75" cy="74.2" r="1.2" fill="var(--txt2)"/></g>
      <g class="w-bang" style="animation-delay:.12s"><rect x="56.1" y="84.2" width="1.8" height="5.8" rx="0.8" fill="var(--txt2)"/><circle cx="57" cy="92.2" r="1.2" fill="var(--txt2)"/></g>
      <g class="ke-cur"><path d="M58 34l15 13-6 1.2 2.9 6.6-2.8 1.2-2.9-6.6-4.2 3.4z" fill="var(--c1)" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></g>
  </g>
</svg>
