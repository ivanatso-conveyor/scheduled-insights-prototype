<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130"
     role="img" aria-label="Conveyor empty state — Keyword search — nothing to search yet">
  <title>Conveyor empty-state motion artwork — Keyword search — nothing to search yet (Warm Sand)</title>
  <style><![CDATA[
    svg{
      --paper:#FFFFFF; --halo:rgba(255,255,255,.45); --txt2:#5a6b66;
      --grid:#DDD4C8; --xline:rgba(150,135,113,.6); --ink:#002118; --ink2:#004331;
      --c1:#008661; --c2:#1DEAB4; --c3:#D8CDBB; --c4:#C1B5A5; --c5:#EFE9E1;
      --acc:#8000DF; --acc2:#E1C0F9; --acc3:#ECE1F5; --pop:#FFB042;
      --sk:#E7E0D6; --sk2:#D3C9BA; --sk3:#F1EBE2; --sk4:#FAF6F0; --ghost:#C1B5A5;
      --bg1:#FBF8F3; --bg2:#F3EDE4; --bg3:#EDE5D9;
    }
    @keyframes kn-q{0%{opacity:0; transform:scaleX(0);} 4%{opacity:1;} 12%,88%{opacity:1; transform:scaleX(1);} 96%,100%{opacity:0; transform:scaleX(1);}}
    @keyframes kn-card{0%,14%{opacity:0; transform:translateY(7px);} 26%,88%{opacity:1; transform:translateY(0);} 96%,100%{opacity:0; transform:translateY(0);}}
    @keyframes kn-h1{0%,30%{opacity:0; transform:scaleX(.25);} 35%,88%{opacity:1; transform:scaleX(1);} 96%,100%{opacity:0; transform:scaleX(1);}}
    @keyframes kn-h2{0%,37%{opacity:0; transform:scaleX(.25);} 42%,88%{opacity:1; transform:scaleX(1);} 96%,100%{opacity:0; transform:scaleX(1);}}
    @keyframes kn-h3{0%,44%{opacity:0; transform:scaleX(.25);} 49%,88%{opacity:1; transform:scaleX(1);} 96%,100%{opacity:0; transform:scaleX(1);}}
    @keyframes kn-h4{0%,51%{opacity:0; transform:scaleX(.25);} 56%,88%{opacity:1; transform:scaleX(1);} 96%,100%{opacity:0; transform:scaleX(1);}}
    .kn-q{transform-box:fill-box; transform-origin:left; animation:kn-q 4.8s cubic-bezier(.2,.8,.3,1) infinite;}
    .kn-card{transform-box:fill-box; transform-origin:center; animation:kn-card 4.8s cubic-bezier(.2,.9,.3,1.25) infinite;}
    .kn-h1,.kn-h2,.kn-h3,.kn-h4{transform-box:fill-box; transform-origin:left; animation-duration:4.8s; animation-timing-function:cubic-bezier(.2,.9,.3,1.2); animation-iteration-count:infinite;}
    .kn-h1{animation-name:kn-h1;} .kn-h2{animation-name:kn-h2;} .kn-h3{animation-name:kn-h3;} .kn-h4{animation-name:kn-h4;}
    @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }]]></style>
  <defs>
    <radialGradient id="wash" cx="0.3" cy="0.2" r="1.1"><stop offset="0" stop-color="#FBF8F3"/><stop offset="0.7" stop-color="#F3EDE4"/><stop offset="1" stop-color="#EDE5D9"/></radialGradient>
  </defs>
  <rect width="130" height="130" rx="8" fill="url(#wash)"/>
  <g>
      <rect x="12" y="12" width="106" height="106" rx="9" fill="var(--halo)"/>
      <rect x="20" y="20" width="90" height="15" rx="4" fill="var(--sk3)"/><g opacity=".55" fill="none" stroke="var(--txt2)" stroke-linecap="round"><circle cx="28" cy="27.0" r="3.5" stroke-width="1.5"/><path d="M30.6 29.6L33.4 32.4" stroke-width="1.7"/></g><rect class="kn-q" x="38" y="25.25" width="20" height="4.5" rx="1.2" fill="var(--sk2)"/>
      <g class="kn-card">
        <rect x="20" y="44" width="90" height="62" rx="5"
              fill="var(--paper)" fill-opacity=".5" stroke="var(--sk2)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <rect x="26" y="52" width="78" height="6" rx="1.5" fill="var(--sk3)"/><rect class="kn-h1" x="36" y="52" width="20" height="6" rx="1.5" fill="var(--ghost)"/>
        <rect x="26" y="65" width="70" height="6" rx="1.5" fill="var(--sk3)"/><rect class="kn-h2" x="58" y="65" width="20" height="6" rx="1.5" fill="var(--ghost)"/>
        <rect x="26" y="78" width="78" height="6" rx="1.5" fill="var(--sk3)"/><rect class="kn-h3" x="44" y="78" width="20" height="6" rx="1.5" fill="var(--ghost)"/>
        <rect x="26" y="91" width="62" height="6" rx="1.5" fill="var(--sk3)"/><rect class="kn-h4" x="62" y="91" width="20" height="6" rx="1.5" fill="var(--ghost)"/>
      </g>
  </g>
</svg>
