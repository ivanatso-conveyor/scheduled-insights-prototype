    .card{filter:drop-shadow(0 1px 2px rgba(0,33,24,.08));}
    @keyframes aq2-r1{0%,19%{opacity:0; transform:scaleX(0);} 23%{opacity:1;} 30%,90%{opacity:1; transform:scaleX(1);} 100%{opacity:0; transform:scaleX(1);}}
    @keyframes aq2-r2{0%,37%{opacity:0; transform:scaleX(0);} 41%{opacity:1;} 48%,90%{opacity:1; transform:scaleX(1);} 100%{opacity:0; transform:scaleX(1);}}
    @keyframes aq2-r3{0%,55%{opacity:0; transform:scaleX(0);} 59%{opacity:1;} 66%,90%{opacity:1; transform:scaleX(1);} 100%{opacity:0; transform:scaleX(1);}}
    @keyframes aq2-r4{0%,71%{opacity:0; transform:scaleX(0);} 75%{opacity:1;} 82%,90%{opacity:1; transform:scaleX(1);} 100%{opacity:0; transform:scaleX(1);}}
    @keyframes aq2-scan{
    0%{opacity:0; transform:translateY(var(--y0,-8px));}
    6%{opacity:1; transform:translateY(var(--y0,-8px));}
    18%{transform:translateY(0px);}
    36%{transform:translateY(var(--y2,13px));}
    54%{transform:translateY(var(--y3,26px));}
    70%,88%{opacity:1; transform:translateY(var(--y4,39px));}
    96%,100%{opacity:0; transform:translateY(var(--y4,39px));}
  }
    .card{filter:drop-shadow(0 1px 2px rgba(0,33,24,.08));}
    .aq2-scan{transform-box:fill-box; transform-origin:center; animation:aq2-scan 6.4s ease-in-out infinite;}
    .aq2-r1,.aq2-r2,.aq2-r3,.aq2-r4{transform-box:fill-box; transform-origin:left; animation-duration:6.4s; animation-timing-function:cubic-bezier(.2,.8,.3,1); animation-iteration-count:infinite;}
    .aq2-r1{animation-name:aq2-r1;}
    .aq2-r2{animation-name:aq2-r2;}
    .aq2-r3{animation-name:aq2-r3;}
    .aq2-r4{animation-name:aq2-r4;}
    @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
  ]]></style>
