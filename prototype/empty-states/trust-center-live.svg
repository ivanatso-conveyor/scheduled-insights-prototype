<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130"
     role="img" aria-label="Conveyor empty state — Go live with your Trust Center">
  <title>Conveyor empty-state motion artwork — Go live with your Trust Center (Warm Sand)</title>
  <style><![CDATA[
    svg{
      --paper:#FFFFFF; --halo:rgba(255,255,255,.45); --txt2:#5a6b66;
      --grid:#DDD4C8; --xline:rgba(150,135,113,.6); --ink:#002118; --ink2:#004331;
      --c1:#008661; --c2:#1DEAB4; --c3:#D8CDBB; --c4:#C1B5A5; --c5:#EFE9E1;
      --acc:#8000DF; --acc2:#E1C0F9; --acc3:#ECE1F5; --pop:#FFB042;
      --sk:#E7E0D6; --sk2:#D3C9BA; --sk3:#F1EBE2; --sk4:#FAF6F0; --ghost:#C1B5A5;
      --bg1:#FBF8F3; --bg2:#F3EDE4; --bg3:#EDE5D9;
      --blu:#1668C4; --blu2:#A9C8EE; --blu3:#E6EEF9;
    }
    .card{filter:drop-shadow(0 1px 2px rgba(0,33,24,.08));}
    @keyframes tcl2-addr{0%,58%{transform:scaleX(0);} 72%,100%{transform:scaleX(1);}}
    @keyframes tcl2-btn{
    0%{opacity:0; transform:scale(.92);}
    7%,20%{opacity:1; transform:scale(1);}
    24%{transform:scale(.955);}
    30%,60%{opacity:1; transform:scale(1);}
    70%,100%{opacity:0; transform:scale(1);}
  }
    @keyframes tcl2-cf1{0%,60%{opacity:0; transform:translate(0px,6px) rotate(0deg);} 68%{opacity:1;} 100%{opacity:0; transform:translate(var(--dx,0px),var(--dy,-14px)) rotate(58deg);}}
    @keyframes tcl2-cf2{0%,63%{opacity:0; transform:translate(0px,6px) rotate(0deg);} 71%{opacity:1;} 100%{opacity:0; transform:translate(var(--dx,0px),var(--dy,-14px)) rotate(-52deg);}}
    @keyframes tcl2-cf3{0%,66%{opacity:0; transform:translate(0px,6px) rotate(0deg);} 74%{opacity:1;} 100%{opacity:0; transform:translate(var(--dx,0px),var(--dy,-14px)) rotate(70deg);}}
    @keyframes tcl2-cf4{0%,69%{opacity:0; transform:translate(0px,6px) rotate(0deg);} 77%{opacity:1;} 100%{opacity:0; transform:translate(var(--dx,0px),var(--dy,-14px)) rotate(-44deg);}}
    @keyframes tcl2-cur{
    0%{opacity:0; transform:translate(-9px,9px);}
    9%{opacity:1; transform:translate(0px,0px);}
    18%{transform:translate(0px,0px);}
    22%{transform:translate(0px,2.2px);}
    29%,44%{transform:translate(0px,0px);}
    54%,100%{opacity:0; transform:translate(7px,11px);}
  }
    @keyframes tcl2-dash{0%,48%{opacity:1;} 60%,100%{opacity:0;}}
    @keyframes tcl2-dot{0%,58%{opacity:0; transform:scale(.3);} 68%,100%{opacity:1; transform:scale(1);}}
    @keyframes tcl2-fill{0%,26%{transform:scaleX(0);} 48%,100%{transform:scaleX(1);}}
    @keyframes tcl2-lbl{0%,26%{opacity:1;} 38%,100%{opacity:0;}}
    @keyframes tcl2-w1{0%,60%{opacity:0; transform:scale(.5);} 71%{opacity:.5; transform:scale(1);} 88%,100%{opacity:0; transform:scale(1.32);}}
    @keyframes tcl2-w2{0%,65%{opacity:0; transform:scale(.5);} 78%{opacity:.34; transform:scale(1);} 95%,100%{opacity:0; transform:scale(1.44);}}
    .card{filter:drop-shadow(0 1px 2px rgba(0,33,24,.08));}
    .tcl2-cur{transform-box:fill-box; transform-origin:center; animation:tcl2-cur 6.8s cubic-bezier(.2,.8,.3,1) infinite;}
    .tcl2-btn{transform-box:fill-box; transform-origin:center; animation:tcl2-btn 6.8s cubic-bezier(.2,.9,.3,1.2) infinite;}
    .tcl2-fill{transform-box:fill-box; transform-origin:left; animation:tcl2-fill 6.8s cubic-bezier(.3,.7,.3,1) infinite;}
    .tcl2-lbl{animation:tcl2-lbl 6.8s ease-in-out infinite;}
    .tcl2-dash{animation:tcl2-dash 6.8s cubic-bezier(.2,.8,.3,1) infinite;}
    .tcl2-addr{transform-box:fill-box; transform-origin:left; animation:tcl2-addr 6.8s cubic-bezier(.2,.8,.3,1) infinite;}
    .tcl2-dot{transform-box:fill-box; transform-origin:center; animation:tcl2-dot 6.8s cubic-bezier(.2,.9,.3,1.35) infinite;}
    .tcl2-w1,.tcl2-w2{transform-box:fill-box; transform-origin:center; animation-duration:6.8s; animation-timing-function:ease-out; animation-iteration-count:infinite;}
    .tcl2-w1{animation-name:tcl2-w1;}
    .tcl2-w2{animation-name:tcl2-w2;}
    .tcl2-cf1,.tcl2-cf2,.tcl2-cf3,.tcl2-cf4{transform-box:fill-box; transform-origin:center;
    animation-duration:6.8s; animation-timing-function:ease-out; animation-iteration-count:infinite;}
    .tcl2-cf1{animation-name:tcl2-cf1;}
    .tcl2-cf2{animation-name:tcl2-cf2;}
    .tcl2-cf3{animation-name:tcl2-cf3;}
    .tcl2-cf4{animation-name:tcl2-cf4;}
    @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
  ]]></style>
  <defs>
    <radialGradient id="wash" cx="0.3" cy="0.2" r="1.1"><stop offset="0" stop-color="#FBF8F3"/><stop offset="0.7" stop-color="#F3EDE4"/><stop offset="1" stop-color="#EDE5D9"/></radialGradient>
  </defs>
  <rect width="130" height="130" rx="8" fill="url(#wash)"/>
  <g>
      <rect x="12" y="12" width="106" height="106" rx="9" fill="var(--halo)"/>
      <circle class="tcl2-w1" cx="65" cy="65" r="30" opacity="0" fill="none" stroke="var(--c1)" stroke-width="1.3"/>
      <circle class="tcl2-w2" cx="65" cy="65" r="30" opacity="0" fill="none" stroke="var(--c1)" stroke-width="1.1"/>
      <rect class="card" x="42" y="37" width="46" height="56" rx="4" fill="var(--paper)"/>
      <circle class="tcl2-dot" cx="49" cy="44" r="2.8" fill="var(--c1)"/>
      <rect class="tcl2-addr" x="56" y="42.5" width="24" height="3" rx="1.1" fill="var(--sk2)"/>
      <rect x="42" y="51" width="46" height="1" rx="1.1" fill="var(--sk3)"/>
      <rect x="48" y="57" width="8" height="8" rx="2" fill="var(--c3)"/>
      <rect x="60" y="59.5" width="14" height="3" rx="1.1" fill="var(--sk2)"/>
      <rect x="48" y="71" width="34" height="8" rx="2" fill="var(--sk3)"/>
      <rect x="48" y="82" width="34" height="8" rx="2" fill="var(--sk3)"/>
      <g class="tcl2-dash" opacity="0">
      <rect x="42" y="37" width="46" height="56" rx="4" fill="var(--sk4)" stroke="var(--sk2)" stroke-width="1.4" stroke-dasharray="4 3"/>
      <rect x="48" y="44" width="8" height="8" rx="2" fill="var(--sk)"/>
      <rect x="60" y="46" width="14" height="3" rx="1.1" fill="var(--sk)"/>
      <rect x="48" y="60" width="34" height="9" rx="2" fill="var(--sk)"/>
      <rect x="48" y="74" width="34" height="9" rx="2" fill="var(--sk)"/>
      </g>
      <g class="tcl2-cf1" opacity="0" style="--dx:-11px; --dy:-15px"><rect x="46" y="32" width="5" height="5" rx="0.8" fill="var(--c2)"/></g>
      <g class="tcl2-cf2" opacity="0" style="--dx:11px; --dy:-14px"><circle cx="84" cy="34" r="3" fill="var(--pop)"/></g>
      <g class="tcl2-cf3" opacity="0" style="--dx:-5px; --dy:-17px"><rect x="58" y="30" width="4.5" height="4.5" rx="0.6" fill="var(--c1)"/></g>
      <g class="tcl2-cf4" opacity="0" style="--dx:8px; --dy:-16px"><circle cx="74" cy="31" r="2.6" fill="var(--c3)"/></g>
      <g class="tcl2-cf2" opacity="0" style="--dx:-10px; --dy:-13px"><rect x="36" y="40" width="4" height="4" rx="0.6" fill="var(--pop)"/></g>
      <g class="tcl2-cf4" opacity="0" style="--dx:9px; --dy:-12px"><circle cx="93" cy="44" r="2.4" fill="var(--c2)"/></g>
      <g class="tcl2-btn" opacity="0">
      <rect class="card" x="44" y="98" width="42" height="14" rx="4.25" fill="var(--c1)"/>
      <rect class="tcl2-fill" x="44" y="98" width="42" height="14" rx="4.25" fill="var(--c2)"/>
      <rect class="tcl2-lbl" x="57" y="103.5" width="16" height="4" rx="1.5" fill="#fff"/>
      </g>
      <g class="tcl2-cur" opacity="0">
      <g transform="translate(35.3,21.5) scale(0.85)">
      <path d="M42 90l15 13-6 1.2 2.9 6.6-2.8 1.2-2.9-6.6-4.2 3.4z" fill="var(--c1)" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
      </g>
      </g>
  </g>
</svg>
