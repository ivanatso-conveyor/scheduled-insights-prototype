    .qa-q,.qa-a,.qa-chip{transform-box:fill-box; transform-origin:center; animation-duration:6.4s; animation-timing-function:cubic-bezier(.2,.9,.3,1.25); animation-iteration-count:infinite;}
    .qa-q{animation-name:qa-q;} .qa-a{animation-name:qa-a;} .qa-chip{animation-name:qa-chip;}
    .qa-r1,.qa-r2,.qa-r3{transform-box:fill-box; transform-origin:left; animation-duration:6.4s; animation-timing-function:cubic-bezier(.2,.8,.3,1); animation-iteration-count:infinite;}
    .qa-c1,.qa-c2,.qa-c3{transform-box:fill-box; transform-origin:center; animation-duration:6.4s; animation-timing-function:cubic-bezier(.2,.9,.3,1.25); animation-iteration-count:infinite;}
    .qa-r1{animation-name:qa-r1;} .qa-r2{animation-name:qa-r2;} .qa-r3{animation-name:qa-r3;}
    .qa-c1{animation-name:qa-c1;} .qa-c2{animation-name:qa-c2;} .qa-c3{animation-name:qa-c3;}
    @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }]]></style>
