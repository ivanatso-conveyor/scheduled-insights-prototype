    @keyframes qa-r1{0%,36%{opacity:0; transform:scaleX(0);} 40%{opacity:1;} 48%,88%{opacity:1; transform:scaleX(1);} 96%,100%{opacity:0; transform:scaleX(1);}}
    @keyframes qa-r2{0%,46%{opacity:0; transform:scaleX(0);} 50%{opacity:1;} 58%,88%{opacity:1; transform:scaleX(1);} 96%,100%{opacity:0; transform:scaleX(1);}}
