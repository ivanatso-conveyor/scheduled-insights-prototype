    .w-chipbump{transform-box:fill-box; transform-origin:center; animation:w-chipbump 5.2s cubic-bezier(.2,.9,.3,1.25) infinite both;}
    @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
