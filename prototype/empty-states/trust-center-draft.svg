<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130"
     role="img" aria-label="Conveyor empty state — Create your first Trust Center draft">
  <title>Conveyor empty-state motion artwork — Create your first Trust Center draft (Warm Sand)</title>
  <style><![CDATA[
    svg{
      --paper:#FFFFFF; --halo:rgba(255,255,255,.45); --txt2:#5a6b66;
      --grid:#DDD4C8; --xline:rgba(150,135,113,.6); --ink:#002118; --ink2:#004331;
      --c1:#008661; --c2:#1DEAB4; --c3:#D8CDBB; --c4:#C1B5A5; --c5:#EFE9E1;
      --acc:#8000DF; --acc2:#E1C0F9; --acc3:#ECE1F5; --pop:#FFB042;
      --sk:#E7E0D6; --sk2:#D3C9BA; --sk3:#F1EBE2; --sk4:#FAF6F0; --ghost:#C1B5A5;
      --bg1:#FBF8F3; --bg2:#F3EDE4; --bg3:#EDE5D9;
      --blu:#1668C4; --blu2:#A9C8EE; --blu3:#E6EEF9;
    }
    .card{filter:drop-shadow(0 1px 2px rgba(0,33,24,.08));}
    @keyframes tcd-b1{0%,18%{opacity:0; transform:translateY(-8px);} 30%,92%{opacity:1; transform:translateY(0px);} 100%{opacity:0; transform:translateY(-8px);}}
    @keyframes tcd-b2{0%,28%{opacity:0; transform:translateY(-8px);} 40%,92%{opacity:1; transform:translateY(0px);} 100%{opacity:0; transform:translateY(-8px);}}
    @keyframes tcd-b3{0%,38%{opacity:0; transform:translateY(-8px);} 50%,92%{opacity:1; transform:translateY(0px);} 100%{opacity:0; transform:translateY(-8px);}}
    @keyframes tcd-frame{
    0%{opacity:0; transform:scale(.94);}
    10%,92%{opacity:1; transform:scale(1);}
    100%{opacity:0; transform:scale(.94);}
  }
    @keyframes tcd-head{0%,8%{opacity:0; transform:translateY(-8px);} 20%,92%{opacity:1; transform:translateY(0px);} 100%{opacity:0; transform:translateY(-8px);}}
    .tcd-frame{transform-box:fill-box; transform-origin:center; animation:tcd-frame 5.4s cubic-bezier(.2,.9,.3,1.2) infinite;}
    .tcd-head,.tcd-b1,.tcd-b2,.tcd-b3{transform-box:fill-box; transform-origin:center;
    animation-duration:5.4s; animation-timing-function:cubic-bezier(.2,.9,.3,1.2); animation-iteration-count:infinite;}
    .tcd-head{animation-name:tcd-head;}
    .tcd-b1{animation-name:tcd-b1;}
    .tcd-b2{animation-name:tcd-b2;}
    .tcd-b3{animation-name:tcd-b3;}
    @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
  ]]></style>
  <defs>
    <radialGradient id="wash" cx="0.3" cy="0.2" r="1.1"><stop offset="0" stop-color="#FBF8F3"/><stop offset="0.7" stop-color="#F3EDE4"/><stop offset="1" stop-color="#EDE5D9"/></radialGradient>
  </defs>
  <rect width="130" height="130" rx="8" fill="url(#wash)"/>
  <g>
      <rect x="12" y="12" width="106" height="106" rx="9" fill="var(--halo)"/>
      <rect class="tcd-frame" x="31" y="22" width="68" height="84" rx="5" fill="var(--paper)" stroke="var(--sk2)" stroke-width="1.4" stroke-dasharray="4 3"/>
      <g class="tcd-head">
      <rect x="38" y="30" width="9" height="9" rx="2" fill="var(--c3)"/>
      <rect x="51" y="33" width="22" height="3.5" rx="1.1" fill="var(--sk2)"/>
      <rect x="38" y="45" width="54" height="1.5" rx="1.1" fill="var(--sk3)"/>
      </g>
      <g class="tcd-b1">
      <rect x="38" y="51" width="54" height="15" rx="3" fill="var(--sk3)"/>
      <rect x="42" y="55" width="20" height="3" rx="1.1" fill="var(--sk2)"/>
      <rect x="42" y="60" width="34" height="2.5" rx="1.1" fill="var(--sk)"/>
      </g>
      <g class="tcd-b2">
      <rect x="38" y="69" width="54" height="15" rx="3" fill="var(--sk3)"/>
      <rect x="42" y="73" width="26" height="3" rx="1.1" fill="var(--sk2)"/>
      <rect x="42" y="78" width="30" height="2.5" rx="1.1" fill="var(--sk)"/>
      </g>
      <g class="tcd-b3">
      <rect x="38" y="87" width="54" height="12" rx="3" fill="var(--sk3)"/>
      <rect x="42" y="91" width="22" height="3" rx="1.1" fill="var(--sk2)"/>
      </g>
  </g>
</svg>
