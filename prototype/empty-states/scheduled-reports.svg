<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130" role="img" aria-labelledby="title desc">
  <title id="title">Emerald Headline, 130 pixel square</title>
  <desc id="desc">An abstract analytics report assembles before a light-tan delivery chip and paper plane appear.</desc>
  <defs>
    <filter id="shadow" x="-45%" y="-45%" width="190%" height="200%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#002118" flood-opacity=".1"/>
    </filter>
    <clipPath id="chipClip"><rect x="75" y="31" width="54" height="28" rx="9"/></clipPath>
    <g id="plane">
      <path d="M0 32L48 0 20 20z" fill="#007A5B" stroke="#007A5B" stroke-width="6" stroke-linejoin="round"/>
      <path d="M20 20L48 0 24 36z" fill="#9BE8D2" stroke="#9BE8D2" stroke-width="6" stroke-linejoin="round"/>
      <path d="M20 20L48 0" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </defs>
  <style><![CDATA[
    .card,.chip{filter:url(#shadow)}
    @keyframes headlineSettle{0%,7%{opacity:0;transform:translateY(2px) scaleX(.82)}24%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateY(-1px) scaleX(.98)}}
    .headline{transform-box:fill-box;transform-origin:left;animation:headlineSettle 6.4s cubic-bezier(.16,1,.3,1) infinite}
    @keyframes copyBuild{0%,9%{opacity:0;transform:scaleX(.3)}30%,88%{opacity:1;transform:scaleX(1)}96%,100%{opacity:0;transform:scaleX(.3)}}
    .copy{transform-box:fill-box;transform-origin:left;animation:copyBuild 6.4s cubic-bezier(.2,.8,.3,1) infinite}
    @keyframes barsBloom{0%,11%{transform:scaleY(.12)}42%,86%{transform:scaleY(1)}95%,100%{transform:scaleY(.12)}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:barsBloom 6.4s cubic-bezier(.2,.85,.3,1) infinite}.b2{animation-delay:.13s}.b3{animation-delay:.26s}.b4{animation-delay:.39s}
    @keyframes rowsBuild{0%,24%{opacity:0;transform:translateX(-3px)}44%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
    .row{animation:rowsBuild 6.4s ease infinite}.r2{animation-delay:.14s}
    @keyframes chipReveal{0%,54%{opacity:0;transform:translateX(5px) scale(.93)}62%,89%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(2px) scale(.98)}}
    .delivery-chip{opacity:0;transform-box:fill-box;transform-origin:center;animation:chipReveal 6.4s cubic-bezier(.16,1,.3,1) infinite}
    @keyframes planeAppear{0%,59%{opacity:0;transform:translateX(-3px) scale(.9)}67%,89%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(3px) scale(.98)}}
    .plane{transform-box:fill-box;transform-origin:center;animation:planeAppear 6.4s cubic-bezier(.16,1,.3,1) infinite}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.headline,.copy,.bar,.row,.delivery-chip,.plane{opacity:1!important;transform:none!important}}
  ]]></style>

  <!-- One uninterrupted light-tan field; no nested or secondary outline. -->
  <rect width="130" height="130" rx="9" fill="#F8F2E9"/>

  <rect class="card" x="27" y="20" width="76" height="90" rx="7" fill="#fff"/>
  <rect class="headline" x="39" y="33" width="34" height="5" rx="1.7" fill="#004F3D"/>
  <rect class="copy" x="39" y="45" width="52" height="3.5" rx="1.2" fill="#A9BDB6"/>

  <line x1="39" y1="89" x2="92" y2="89" stroke="#DDD4C8" stroke-width="1.2"/>
  <g class="bar"><rect x="44" y="73" width="7" height="16" rx="1.7" fill="#D8CDBB"/></g>
  <g class="bar b2"><rect x="55" y="64" width="7" height="25" rx="1.7" fill="#DEC4F4"/></g>
  <g class="bar b3"><rect x="66" y="53" width="7" height="36" rx="1.7" fill="#008661"/></g>
  <g class="bar b4"><rect x="77" y="68" width="7" height="21" rx="1.7" fill="#D8CDBB"/></g>

  <g class="row"><circle cx="41" cy="100" r="2.2" fill="#008661"/><rect x="46" y="98.2" width="24" height="3.6" rx="1.2" fill="#CFC5B6"/></g>
  <g class="row r2"><circle cx="75" cy="100" r="2.2" fill="#8000DF"/><rect x="80" y="98.2" width="13" height="3.6" rx="1.2" fill="#E6D5F2"/></g>

  <g class="delivery-chip">
    <rect class="chip" x="76" y="32" width="52" height="26" rx="8" fill="#F8F2E9"/>
    <g clip-path="url(#chipClip)"><g transform="translate(82 39) scale(.28)"><g class="plane"><use href="#plane"/></g></g></g>
    <rect x="105" y="43" width="16" height="4" rx="1.4" fill="#004F3D"/>
  </g>
</svg>
